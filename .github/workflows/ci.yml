name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff black
      - run: ruff check . || true
      - run: black --check . || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest pytest-cov pyyaml
      - run: |
          pytest -q --cov=scripts --cov-report=json || true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
        continue-on-error: true

  audit:
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      COVERAGE_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: coverage
        continue-on-error: true
      - run: python scripts/convert_coverage.py || true
      - run: python scripts/coverage_gate.py || true
